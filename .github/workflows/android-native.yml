name: Android Native

on:
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android-native/gradlew

      - name: Run unit tests
        working-directory: android-native
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        working-directory: android-native
        run: ./gradlew assembleDebug --no-daemon --console=plain

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: android-native-${{ github.sha }}
      RELEASE_APK: android-native/app/build/outputs/apk/release/app-release.apk
      RELEASE_ASSET: sms-ntfy-android-native-release.apk
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Restore stable release keystore
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/android-release.jks
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          test -s "$ANDROID_RELEASE_KEYSTORE"

      - name: Build signed release APK
        working-directory: android-native
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/android-release.jks
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify release APK
        run: |
          test -s "$RELEASE_APK"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR/apksigner" verify --verbose "$RELEASE_APK"
          sha256sum "$RELEASE_APK"
          unzip -t "$RELEASE_APK"
          cp "$RELEASE_APK" "$RUNNER_TEMP/$RELEASE_ASSET"

      - name: Publish deterministic GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$RELEASE_ASSET" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Android Native latest" \
              --notes "Installable Android release from main commit $GITHUB_SHA." \
              --latest
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$RELEASE_ASSET" \
              --target "$GITHUB_SHA" \
              --title "Android Native latest" \
              --notes "Installable Android release from main commit $GITHUB_SHA." \
              --latest
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[] | select(.name == env.RELEASE_ASSET and .size > 0)] | length')" = "1"
