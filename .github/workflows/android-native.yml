name: Android Native

on:
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.88.0'
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Set up Android NDK r26d
        id: ndk
        uses: nttld/setup-ndk@aacaf74664d0f8e1b070a865acb47ee25007386d # v1.6.0
        with:
          ndk-version: r26d
          local-cache: true

      - name: Build pinned Aether core for supported Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: android-native/scripts/build-aether-android.sh

      - name: Verify Aether binaries and notices
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            test -s "android-native/app/src/main/jniLibs/$abi/libaether.so"
          done
          test -s android-native/app/src/main/assets/aether/AGPL-3.0.txt
          grep -q a916ff6fbbb4ebafe8314c53cf3718eb51dcae53 android-native/app/src/main/assets/aether/NOTICE.md

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android-native/gradlew

      - name: Run tests and build debug APKs
        working-directory: android-native
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --console=plain

      - name: Verify debug APK contains Aether and notices
        run: |
          unzip -Z1 android-native/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/debug-apk-entries.txt"
          for abi in arm64-v8a armeabi-v7a; do
            grep -Fx "lib/$abi/libaether.so" "$RUNNER_TEMP/debug-apk-entries.txt"
          done
          grep -Fx 'assets/aether/AGPL-3.0.txt' "$RUNNER_TEMP/debug-apk-entries.txt"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            asset: sms-ntfy-android-native-arm64-v8a.apk
          - abi: armeabi-v7a
            asset: sms-ntfy-android-native-armeabi-v7a.apk
    env:
      RELEASE_TAG: android-native-${{ github.sha }}
      RELEASE_APK: android-native/app/build/outputs/apk/release/app-release.apk
      RELEASE_ASSET: ${{ matrix.asset }}
      ANDROID_RELEASE_ABI: ${{ matrix.abi }}
      AETHER_ABIS: ${{ matrix.abi }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.88.0'
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Set up Android NDK r26d
        id: ndk
        uses: nttld/setup-ndk@aacaf74664d0f8e1b070a865acb47ee25007386d # v1.6.0
        with:
          ndk-version: r26d
          local-cache: true

      - name: Build pinned Aether core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: android-native/scripts/build-aether-android.sh

      - name: Restore stable release keystore
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/android-release.jks
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          test -s "$ANDROID_RELEASE_KEYSTORE"

      - name: Build signed release APK
        working-directory: android-native
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/android-release.jks
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify release APK
        run: |
          test -s "$RELEASE_APK"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR/apksigner" verify --verbose "$RELEASE_APK"
          sha256sum "$RELEASE_APK"
          unzip -t "$RELEASE_APK"
          unzip -Z1 "$RELEASE_APK" > "$RUNNER_TEMP/release-apk-entries.txt"
          grep -Fx "lib/$ANDROID_RELEASE_ABI/libaether.so" "$RUNNER_TEMP/release-apk-entries.txt"
          test "$(grep -Ec '^lib/(arm64-v8a|armeabi-v7a)/libaether\.so$' "$RUNNER_TEMP/release-apk-entries.txt")" = "1"
          grep -Fx 'assets/aether/AGPL-3.0.txt' "$RUNNER_TEMP/release-apk-entries.txt"
          grep -Fx 'assets/aether/NOTICE.md' "$RUNNER_TEMP/release-apk-entries.txt"
          cp "$RELEASE_APK" "$RUNNER_TEMP/$RELEASE_ASSET"

      - name: Upload per-ABI release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sms-ntfy-${{ matrix.abi }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: android-native-${{ github.sha }}
    steps:
      - name: Download per-ABI APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: sms-ntfy-*
          merge-multiple: true

      - name: Publish deterministic GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -name '*.apk' -print | sort)
          test "${#assets[@]}" = "2"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Android Native latest" \
              --notes "Per-ABI Android releases from main commit $GITHUB_SHA. versionCode: $GITHUB_RUN_NUMBER" \
              --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Android Native latest" \
              --notes "Per-ABI Android releases from main commit $GITHUB_SHA. versionCode: $GITHUB_RUN_NUMBER" \
              --latest
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[] | select((.name | test("^sms-ntfy-android-native-(arm64-v8a|armeabi-v7a)\\.apk$")) and .size > 0)] | length')" = "2"
