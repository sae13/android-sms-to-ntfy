name: Android Native

on:
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android-native/gradlew

      - name: Run unit tests
        working-directory: android-native
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        working-directory: android-native
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
