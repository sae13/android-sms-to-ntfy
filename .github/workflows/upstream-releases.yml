name: Upstream Releases

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: upstream-releases
  cancel-in-progress: false

jobs:
  dispatch-unhandled-stable-releases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dependency: aether
            repository: CluvexStudio/Aether
            release_prefix: android-native-aether-
            input_name: aether_tag
            counterpart_input: deltachat_tag
          - dependency: deltachat
            repository: deltachat/deltachat-android
            release_prefix: android-native-deltachat-
            input_name: deltachat_tag
            counterpart_input: aether_tag
    steps:
      - name: Find latest unhandled stable release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_REPOSITORY: ${{ matrix.repository }}
          RELEASE_PREFIX: ${{ matrix.release_prefix }}
        run: |
          release="$(curl --fail --silent --show-error \
            --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$UPSTREAM_REPOSITORY/releases/latest")"
          tag="$(jq -r '.tag_name' <<< "$release")"
          test "$(jq -r '.draft' <<< "$release")" = "false"
          test "$(jq -r '.prerelease' <<< "$release")" = "false"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          release_tag="$RELEASE_PREFIX$tag"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            printf 'dispatch=false\n' >> "$GITHUB_OUTPUT"
            printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          else
            printf 'dispatch=true\n' >> "$GITHUB_OUTPUT"
            printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and release latest upstream tag
        if: steps.upstream.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_NAME: ${{ matrix.input_name }}
          COUNTERPART_INPUT: ${{ matrix.counterpart_input }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: gh workflow run android-native.yml --ref main -f "$INPUT_NAME=$UPSTREAM_TAG" -f "$COUNTERPART_INPUT="

      - name: Record already released dependency
        if: steps.upstream.outputs.dispatch != 'true'
        env:
          DEPENDENCY: ${{ matrix.dependency }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: printf '%s %s already has a release\n' "$DEPENDENCY" "${UPSTREAM_TAG:-latest}"
